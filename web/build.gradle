plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'
}

repositories {
    mavenCentral()
}

sourceCompatibility = 17
targetCompatibility = 17

dependencies {
    implementation project(':core')
    implementation teavm.libs.jso
    implementation teavm.libs.jsoApis
}

/**
 * -Pproduction builds what gets deployed: smaller, and without the Java
 * sources that the source map drags along. Off by default, so a plain
 * build stays debuggable.
 */
def production = providers.gradleProperty('production').present

teavm.js {
    mainClass = 'org.flightclub.XCGameWeb'
    targetFileName = 'flightclub.js'
    obfuscated = production
    sourceMap = !production
}

/**
 * Everything the browser needs, in one directory
 */
tasks.register('webApp', Sync) {
    dependsOn tasks.named('generateJavaScript')

    from('src/main/webapp')
    from(layout.buildDirectory.dir('generated/teavm/js'))

    into layout.buildDirectory.dir('webApp')
}
