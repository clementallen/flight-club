name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. A queued run is superseded by a newer one rather
# than racing it, but a run already publishing is left to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is a binary in the repo, so check it is a real one
      - uses: gradle/actions/wrapper-validation@v4

      # Gradle 8.11.1 supports up to Java 23, and sourceCompatibility 1.7
      # is rejected by javac from JDK 20 onwards
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the browser bundle
        run: ./gradlew :web:webApp -Pproduction

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 4.129.1 depends on an unpublished miniflare alpha and fails to install
          wranglerVersion: '4.129.0'
